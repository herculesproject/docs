# Datos curados para la generación automática de nav en mkdocs.yml
# (ver scripts/generate_nav.py). Este fichero SÍ se edita a mano cuando
# se añade contenido nuevo: el orden de las páginas dentro de cada
# carpeta no es derivable automáticamente (sigue un orden funcional/de
# ciclo de vida heredado de Confluence, no alfabético), así que se
# registra aquí explícitamente. Las páginas nuevas que no aparezcan en
# "order" se añaden al final de su grupo por orden alfabético.

# Estructura de nivel superior del sitio. "roots" son las carpetas de
# docs/hercules que se promocionan a pestaña de navegación de primer
# nivel. "umbrella" es la pestaña de portada: solo contiene index.md
# (ya no enlaza también a cada root — esos enlaces eran duplicados de
# las pestañas que ya están al lado, y se quitaron).
top_level:
  umbrella_label_override: "Visión general"   # antes: null (usaba el H1 "Hércules")
  umbrella_extra_pages: []
  roots:
    - dir: sgi
      label_override: "SGI"
    - dir: arquitectura
      label_override: "Arquitectura"
    - dir: apis
      label_override: null
    - dir: portal-avanzado
      label_override: "Portal Avanzado Investigación"
    - dir: herramienta-cv
      label_override: "Herramienta CV"
    - dir: rpa
      label_override: null

# Etiquetas del menú distintas del título de la página (ruta relativa a
# docs/: un fichero .md o una carpeta, que usa su index.md). Solo para
# títulos que repiten el nombre de su pestaña y resultan demasiado largos
# como cabecera de sección del menú lateral.
labels:
  arquitectura/arquitectura-de-la-herramienta-de-cv-hercules-ed-enriquecimiento-de-datos.md: "Herramienta de CV (Hércules ED)"
  arquitectura/arquitectura-del-portal-nacional-avanzado-de-investigacion-hercules-ma-metodos-de-analisis.md: "Portal Avanzado de Investigación (Hércules MA)"
  arquitectura/arquitectura-de-hercules-rpa.md: "Hércules RPA"
  sgi/mdu-manual-de-usuario: "Manual de usuario"
  portal-avanzado/analisis-funcional-portal-nacional-avanzado-de-investigacion-hercules-ma-metodos-de-analisis: "Análisis funcional"
  portal-avanzado/ma-manual-de-usuario: "Manual de usuario"
